name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the Docker image; 3.13 matches local development.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest

  runtime-deps:
    # The Docker image installs only the runtime dependencies (pip install .);
    # check that is enough to load the saved model and import the API and
    # dashboard, and that it installs the library versions the model was
    # trained with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Load the model and import the app
        run: |
          python -c "import app.api.main as api; print(api.METADATA['model'], api.THRESHOLD)"
          python -c "import streamlit, requests; print('dashboard dependencies OK')"

      - name: Runtime versions match the ones the model was trained with
        run: |
          python - <<'EOF'
          import json
          from importlib.metadata import version

          trained = json.load(open("models/model_metadata.json"))["versions"]
          for lib in ("scikit-learn", "pandas", "numpy", "joblib"):
              installed = version(lib)
              print(f"{lib}: trained {trained[lib]}, installed {installed}")
              assert installed == trained[lib], f"{lib} differs from the training version"
          EOF
